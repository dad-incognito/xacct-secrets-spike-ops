name: rung3

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        required: true
        type: string

permissions: {}

jobs:
  rung3:
    uses: andrewferk/xacct-secrets-spike-lib/.github/workflows/rung3.yml@main
    with:
      expected_sha256: ${{ inputs.expected_sha256 }}
    secrets:
      SPIKE_SECRET: ${{ secrets.SPIKE_SECRET }}
